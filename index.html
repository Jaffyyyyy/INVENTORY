<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAM-ON ES - Secure Portal</title>
    <!-- Google Fonts & FontAwesome -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Pre-load Auth Check to prevent flickering -->
    <script>
        const activeSession = JSON.parse(localStorage.getItem('mamon_user_session'));
        if (!activeSession) {
            window.location.href = 'login.html'; // Redirect if not logged in
        }
    </script>

    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #1e3a8a 0%, #2563eb 50%, #3b82f6 100%);
            --primary: #2563eb;
            --primary-dark: #1e3a8a;
            --primary-light: #eff6ff;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius-lg: 16px;
            --radius-md: 10px;
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.04);
            --shadow-md: 0 10px 15px -3px rgba(0,0,0,0.08);
            --shadow-lg: 0 20px 25px -5px rgba(0,0,0,0.1);
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- Header --- */
        header {
            background: var(--surface);
            padding: 1.25rem 2rem;
            box-shadow: var(--shadow-sm);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .brand-icon {
            width: 45px;
            height: 45px;
            background: var(--primary-gradient);
            color: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2);
        }

        .brand-text h1 {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .brand-text p {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .user-nav {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-align: right;
        }

        .user-info h4 {
            font-size: 0.9rem;
            font-weight: 700;
        }

        .user-info p {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: capitalize;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--primary-light);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            border: 2px solid white;
            box-shadow: var(--shadow-sm);
        }

        /* --- Main Layout --- */
        .container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            width: 100%;
            flex: 1;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Tabs --- */
        .tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .tab-btn {
            padding: 0.85rem 1.5rem;
            border: none;
            background: var(--surface);
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border: 1px solid var(--border);
        }

        .tab-btn:hover {
            color: var(--primary);
            transform: translateY(-2px);
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        .tab-view { display: none; }
        .tab-view.active-view { display: block; animation: fadeIn 0.3s ease; }

        /* --- Cards & Tables --- */
        .card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            overflow: hidden;
            margin-bottom: 2rem;
        }

        .card-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            background: #fafafa;
        }

        .search-wrapper {
            position: relative;
            min-width: 350px;
        }

        .search-wrapper i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .search-wrapper input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            transition: all 0.2s ease;
            background: white;
        }

        .search-wrapper input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .action-group {
            display: flex;
            gap: 0.75rem;
        }

        /* ADMIN ONLY CLASS - Hidden by default in JS if not admin */
        .admin-only {
            display: none !important; 
        }

        /* --- Buttons --- */
        .btn {
            padding: 0.75rem 1.25rem;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--primary-gradient);
            color: white;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(37, 99, 235, 0.3);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
            background: white;
        }

        .btn-outline:hover {
            background: var(--bg);
            border-color: #cbd5e1;
        }

        .btn-danger {
            background: #fef2f2;
            color: var(--danger);
            border: 1px solid #fecaca;
        }

        .btn-danger:hover {
            background: #fee2e2;
        }

        .btn-icon {
            padding: 0.5rem;
            font-size: 0.9rem;
            border-radius: 8px;
            color: var(--text-muted);
            background: transparent;
        }

        .btn-icon:hover {
            background: var(--primary-light);
            color: var(--primary);
        }

        /* --- Table Styling --- */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: white;
            padding: 1.25rem 1.5rem;
            font-weight: 700;
            color: #334155;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 2px solid var(--border);
            white-space: nowrap;
        }

        td {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
            vertical-align: middle;
        }

        tr { transition: background 0.2s ease; }
        tr:hover { background: #f8fafc; }

        .badge {
            padding: 0.35rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            display: inline-block;
        }

        .badge-teacher { background: #dbeafe; color: #1e40af; }
        .badge-admin { background: #fef3c7; color: #b45309; }
        .badge-me { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }

        /* --- Modals --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal {
            background: var(--surface);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 700px;
            padding: 2.5rem;
            box-shadow: var(--shadow-lg);
            transform: translateY(20px) scale(0.95);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-overlay.active .modal {
            transform: translateY(0) scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .modal-header h3 {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group.full { grid-column: span 2; }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        .form-group input, .form-group select {
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            transition: border-color 0.2s ease;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .form-group input:read-only, .form-group select:disabled {
            background-color: #f1f5f9;
            color: #94a3b8;
            cursor: not-allowed;
        }

        .modal-footer {
            margin-top: 2rem;
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="brand">
            <div class="brand-icon"><i class="fa-solid fa-school"></i></div>
            <div class="brand-text">
                <h1>MAM-ON ES PORTAL</h1>
                <p>Digital Database System</p>
            </div>
        </div>
        <div class="user-nav">
            <div class="user-profile">
                <div class="user-info">
                    <h4 id="display-email">User</h4>
                    <p id="display-role">Role</p>
                </div>
                <div class="avatar"><i class="fa-solid fa-user"></i></div>
            </div>
            <button class="btn btn-outline btn-danger" id="logout-btn">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> Sign Out
            </button>
        </div>
    </header>

    <div class="container">
        <!-- Navigation Tabs -->
        <div class="tabs">
            <button class="tab-btn active" id="tab-directory"><i class="fa-solid fa-users"></i> Personnel Directory</button>
            <button class="tab-btn" id="tab-pdb"><i class="fa-solid fa-address-card"></i> Personal Database (PDB)</button>
        </div>

        <!-- View 1: Directory -->
        <div id="view-directory" class="tab-view active-view">
            <div class="card">
                <div class="card-header">
                    <div class="search-wrapper">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="search-input" placeholder="Search by name, position, email...">
                    </div>
                    <div class="action-group">
                        <!-- THESE BUTTONS HAVE 'admin-only' CLASS -->
                        <button class="btn btn-outline admin-action admin-only" id="export-btn"><i class="fa-solid fa-file-export"></i> Export CSV</button>
                        <button class="btn btn-primary admin-action admin-only" id="open-add-modal-btn"><i class="fa-solid fa-plus"></i> Add Personnel</button>
                    </div>
                </div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Emp ID</th>
                                <th>Full Name</th>
                                <th>Position / Role</th>
                                <th>Department</th>
                                <th>Contact Information</th>
                                <th style="text-align: right;">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="personnel-table-body">
                            <!-- Injected via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- View 2: PDB -->
        <div id="view-pdb" class="tab-view">
            <div class="card">
                <div class="card-header">
                    <div class="search-wrapper">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="pdb-search-input" placeholder="Search government IDs, names...">
                    </div>
                    <div class="action-group">
                        <!-- THESE BUTTONS HAVE 'admin-only' CLASS -->
                        <button class="btn btn-outline admin-action admin-only" id="pdb-export-btn"><i class="fa-solid fa-file-export"></i> Export PDB</button>
                        <button class="btn btn-primary admin-action admin-only" id="open-pdb-modal-btn"><i class="fa-solid fa-plus"></i> New PDB Record</button>
                    </div>
                </div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Full Name</th>
                                <th>TIN Number</th>
                                <th>GSIS BP NO.</th>
                                <th>PAG-IBIG MID</th>
                                <th>PhilHealth NO.</th>
                                <th>Contact & Civil Status</th>
                                <th style="text-align: right;">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="pdb-table-body">
                            <!-- Injected via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modals (Hidden by default) -->
    <!-- Personnel Modal -->
    <div class="modal-overlay" id="personnel-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title">Personnel Record</h3>
                <button class="btn btn-icon" id="close-modal-btn"><i class="fa-solid fa-xmark fa-lg"></i></button>
            </div>
            <form id="personnel-form">
                <input type="hidden" id="edit-index" value="-1">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Employee ID</label>
                        <input type="text" id="emp-id" required>
                    </div>
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="emp-name" required>
                    </div>
                    <div class="form-group">
                        <label>Position</label>
                        <input type="text" id="emp-position" required>
                    </div>
                    <div class="form-group">
                        <label>Department</label>
                        <input type="text" id="emp-dept" required>
                    </div>
                    <div class="form-group">
                        <label>DepEd Email</label>
                        <input type="email" id="emp-email" required>
                    </div>
                    <div class="form-group">
                        <label>Contact Number</label>
                        <input type="text" id="emp-contact" required>
                    </div>
                    <div class="form-group full">
                        <label>System Role Category</label>
                        <select id="role-type">
                            <option value="teacher">Teaching Personnel</option>
                            <option value="admin">Administrator / Principal</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" id="cancel-modal-btn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Details</button>
                </div>
            </form>
        </div>
    </div>

    <!-- PDB Modal -->
    <div class="modal-overlay" id="pdb-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="pdb-modal-title">Personal Database Record</h3>
                <button class="btn btn-icon" id="close-pdb-modal-btn"><i class="fa-solid fa-xmark fa-lg"></i></button>
            </div>
            <form id="pdb-form">
                <input type="hidden" id="pdb-edit-index" value="-1">
                <div class="form-grid">
                    <div class="form-group full">
                        <label>Full Name</label>
                        <input type="text" id="pdb-name" required>
                    </div>
                    <div class="form-group">
                        <label>TIN Number</label>
                        <input type="text" id="pdb-tin">
                    </div>
                    <div class="form-group">
                        <label>GSIS BP NO.</label>
                        <input type="text" id="pdb-gsis">
                    </div>
                    <div class="form-group">
                        <label>PAG-IBIG MID</label>
                        <input type="text" id="pdb-pagibig">
                    </div>
                    <div class="form-group">
                        <label>PhilHealth NO.</label>
                        <input type="text" id="pdb-philhealth">
                    </div>
                    <div class="form-group">
                        <label>Civil Status</label>
                        <input type="text" id="pdb-civil">
                    </div>
                    <div class="form-group">
                        <label>Contact No.</label>
                        <input type="text" id="pdb-phone">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" id="cancel-pdb-modal-btn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Record</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // --- 1. Session & Permission Enforcement ---
        const userRole = activeSession.role || 'teacher';
        const userEmail = activeSession.email || '';
        
        // Update Header UI
        document.getElementById('display-email').innerText = userEmail.split('@')[0] || 'User';
        document.getElementById('display-role').innerText = userRole === 'admin' ? 'System Administrator' : 'Portal Guest / Teacher';

        // STRICT SECURITY RULE: Make Admin Action buttons visible ONLY if admin
        if (userRole === 'admin') {
            document.querySelectorAll('.admin-only').forEach(btn => {
                btn.style.setProperty('display', 'inline-flex', 'important');
            });
        }

        // --- 2. Datasets (Mock Database) ---
        let personnelData = JSON.parse(localStorage.getItem('mamon_personnel')) || [
            { id: "ADMIN-001", name: "System Administrator", position: "Principal", department: "Admin", email: "admin.mamon@deped.gov.ph", contact: "09000000000", roleType: "admin" },
            { id: "6459395", name: "Jenny Queen L. Orillaneda", position: "Teacher I", department: "Elementary", email: "jennyqueen.orillaneda@deped.gov.ph", contact: "09704809343", roleType: "teacher" },
            { id: "6450528", name: "Jasper S. Campado", position: "Admin Officer II", department: "Elementary", email: "jasper.campado@deped.gov.ph", contact: "09241132506", roleType: "teacher" }
        ];

        let pdbData = JSON.parse(localStorage.getItem('mamon_pdb')) || [
            { name: "Jenny Queen L. Orillaneda", tin: "3826478650000", gsis: "2006724079", pagibig: "182012173335", philhealth: "0795079220", civil: "Single", phone: "09704809343" },
            { name: "Jasper S. Campado", tin: "605690915000", gsis: "2006426639", pagibig: "182511543852", philhealth: "0795-0692-83", civil: "Single", phone: "09241132506" }
        ];

        function saveData() {
            localStorage.setItem('mamon_personnel', JSON.stringify(personnelData));
            localStorage.setItem('mamon_pdb', JSON.stringify(pdbData));
        }

        // --- 3. Table Renderers ---
        function isOwnRecord(item) {
            return (item.email && item.email.toLowerCase() === userEmail.toLowerCase()) || 
                   (item.id && item.id === activeSession.empId);
        }

        function renderDirectory() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const tbody = document.getElementById('personnel-table-body');
            
            tbody.innerHTML = personnelData.filter(p => p.name.toLowerCase().includes(query) || p.email.toLowerCase().includes(query)).map((p, index) => {
                const ownsRecord = isOwnRecord(p);
                const roleBadge = p.roleType === 'admin' ? 'badge-admin' : 'badge-teacher';
                const meBadge = ownsRecord ? `<span class="badge badge-me" style="margin-left: 8px;">YOU</span>` : '';
                
                // Allow edit if Admin OR if it's the user's own profile. Delete strictly Admin.
                const canEdit = userRole === 'admin' || ownsRecord;
                const canDelete = userRole === 'admin';

                return `
                    <tr>
                        <td><strong>${p.id}</strong></td>
                        <td>
                            <div style="font-weight: 600; color: var(--text-main);">${p.name} ${meBadge}</div>
                        </td>
                        <td>
                            <div style="font-weight: 500;">${p.position}</div>
                            <span class="badge ${roleBadge}" style="margin-top: 4px;">${p.roleType.toUpperCase()}</span>
                        </td>
                        <td>${p.department}</td>
                        <td>
                            <div style="font-size: 0.85rem;"><i class="fa-regular fa-envelope" style="color: var(--text-muted); margin-right: 4px;"></i> ${p.email}</div>
                            <div style="font-size: 0.85rem; margin-top: 4px;"><i class="fa-solid fa-phone" style="color: var(--text-muted); margin-right: 4px;"></i> ${p.contact}</div>
                        </td>
                        <td style="text-align: right;">
                            <div style="display: flex; justify-content: flex-end; gap: 0.5rem;">
                                ${canEdit ? `<button class="btn btn-icon" onclick="openEdit(${index})" title="Edit"><i class="fa-solid fa-pen"></i></button>` : `<span style="font-size:0.8rem; color: #cbd5e1;">Read-only</span>`}
                                ${canDelete ? `<button class="btn btn-icon" style="color: var(--danger);" onclick="deleteRecord(${index})" title="Delete"><i class="fa-solid fa-trash"></i></button>` : ''}
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function renderPDB() {
            const query = document.getElementById('pdb-search-input').value.toLowerCase();
            const tbody = document.getElementById('pdb-table-body');
            
            tbody.innerHTML = pdbData.filter(p => p.name.toLowerCase().includes(query) || p.tin.includes(query)).map((p, index) => {
                
                const matchingPersonnel = personnelData.find(x => x.name.toLowerCase() === p.name.toLowerCase());
                const ownsRecord = matchingPersonnel ? isOwnRecord(matchingPersonnel) : false;
                const canEdit = userRole === 'admin' || ownsRecord;
                const canDelete = userRole === 'admin';

                return `
                    <tr>
                        <td style="font-weight: 600;">${p.name}</td>
                        <td><code style="background: #f1f5f9; padding: 2px 6px; border-radius: 4px; font-size:0.85rem;">${p.tin || 'N/A'}</code></td>
                        <td><code style="background: #f1f5f9; padding: 2px 6px; border-radius: 4px; font-size:0.85rem;">${p.gsis || 'N/A'}</code></td>
                        <td><code style="background: #f1f5f9; padding: 2px 6px; border-radius: 4px; font-size:0.85rem;">${p.pagibig || 'N/A'}</code></td>
                        <td><code style="background: #f1f5f9; padding: 2px 6px; border-radius: 4px; font-size:0.85rem;">${p.philhealth || 'N/A'}</code></td>
                        <td>
                            <div style="font-size: 0.85rem;"><i class="fa-solid fa-phone" style="color: var(--text-muted); margin-right: 4px;"></i> ${p.phone}</div>
                            <div style="font-size: 0.8rem; color: var(--text-muted); margin-top: 2px;">Status: ${p.civil}</div>
                        </td>
                        <td style="text-align: right;">
                            <div style="display: flex; justify-content: flex-end; gap: 0.5rem;">
                                ${canEdit ? `<button class="btn btn-icon" onclick="openPdbEdit(${index})" title="Edit Data"><i class="fa-solid fa-pen"></i></button>` : `<span style="font-size:0.8rem; color: #cbd5e1;">Read-only</span>`}
                                ${canDelete ? `<button class="btn btn-icon" style="color: var(--danger);" onclick="deletePdb(${index})" title="Delete"><i class="fa-solid fa-trash"></i></button>` : ''}
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // --- 4. Interactivity & Modals ---
        // Tab Switching
        document.getElementById('tab-directory').addEventListener('click', (e) => {
            e.target.classList.add('active');
            document.getElementById('tab-pdb').classList.remove('active');
            document.getElementById('view-directory').classList.add('active-view');
            document.getElementById('view-pdb').classList.remove('active-view');
            renderDirectory();
        });

        document.getElementById('tab-pdb').addEventListener('click', (e) => {
            e.target.classList.add('active');
            document.getElementById('tab-directory').classList.remove('active');
            document.getElementById('view-pdb').classList.add('active-view');
            document.getElementById('view-directory').classList.remove('active-view');
            renderPDB();
        });

        // Search Listeners
        document.getElementById('search-input').addEventListener('input', renderDirectory);
        document.getElementById('pdb-search-input').addEventListener('input', renderPDB);

        // Sign Out
        document.getElementById('logout-btn').addEventListener('click', () => {
            localStorage.removeItem('mamon_user_session');
            window.location.href = 'login.html';
        });

        // Add/Edit Functions (Global Window Binding)
        window.openEdit = function(index) {
            const p = personnelData[index];
            document.getElementById('edit-index').value = index;
            document.getElementById('modal-title').innerText = "Edit Personnel Profile";
            
            document.getElementById('emp-id').value = p.id;
            document.getElementById('emp-name').value = p.name;
            document.getElementById('emp-position').value = p.position;
            document.getElementById('emp-dept').value = p.department;
            document.getElementById('emp-email').value = p.email;
            document.getElementById('emp-contact').value = p.contact;
            document.getElementById('role-type').value = p.roleType;

            // Lock sensitive fields if not admin
            if (userRole !== 'admin') {
                document.getElementById('emp-id').readOnly = true;
                document.getElementById('role-type').disabled = true;
            } else {
                document.getElementById('emp-id').readOnly = false;
                document.getElementById('role-type').disabled = false;
            }
            
            document.getElementById('personnel-modal').classList.add('active');
        };

        window.deleteRecord = function(index) {
            if(confirm("Are you sure you want to completely remove this personnel record?")) {
                personnelData.splice(index, 1);
                saveData(); renderDirectory();
            }
        };

        window.openPdbEdit = function(index) {
            const p = pdbData[index];
            document.getElementById('pdb-edit-index').value = index;
            document.getElementById('pdb-modal-title').innerText = "Edit Secure ID Records";
            
            document.getElementById('pdb-name').value = p.name;
            document.getElementById('pdb-tin').value = p.tin;
            document.getElementById('pdb-gsis').value = p.gsis;
            document.getElementById('pdb-pagibig').value = p.pagibig;
            document.getElementById('pdb-philhealth').value = p.philhealth;
            document.getElementById('pdb-civil').value = p.civil;
            document.getElementById('pdb-phone').value = p.phone;
            
            // Lock name if not admin to prevent assigning IDs to someone else
            document.getElementById('pdb-name').readOnly = (userRole !== 'admin');
            
            document.getElementById('pdb-modal').classList.add('active');
        };

        window.deletePdb = function(index) {
            if(confirm("Delete these secure ID records permanently?")) {
                pdbData.splice(index, 1);
                saveData(); renderPDB();
            }
        };

        // Form Submissions
        document.getElementById('personnel-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const idx = document.getElementById('edit-index').value;
            const record = {
                id: document.getElementById('emp-id').value,
                name: document.getElementById('emp-name').value,
                position: document.getElementById('emp-position').value,
                department: document.getElementById('emp-dept').value,
                email: document.getElementById('emp-email').value,
                contact: document.getElementById('emp-contact').value,
                roleType: document.getElementById('role-type').value
            };
            if(idx > -1) personnelData[idx] = record;
            else personnelData.unshift(record);
            
            saveData(); renderDirectory();
            document.getElementById('personnel-modal').classList.remove('active');
        });

        document.getElementById('pdb-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const idx = document.getElementById('pdb-edit-index').value;
            const record = {
                name: document.getElementById('pdb-name').value,
                tin: document.getElementById('pdb-tin').value,
                gsis: document.getElementById('pdb-gsis').value,
                pagibig: document.getElementById('pdb-pagibig').value,
                philhealth: document.getElementById('pdb-philhealth').value,
                civil: document.getElementById('pdb-civil').value,
                phone: document.getElementById('pdb-phone').value
            };
            if(idx > -1) pdbData[idx] = record;
            else pdbData.unshift(record);
            
            saveData(); renderPDB();
            document.getElementById('pdb-modal').classList.remove('active');
        });

        // Open Add Modals (Only applicable to Admins since button is hidden otherwise)
        if(document.getElementById('open-add-modal-btn')) {
            document.getElementById('open-add-modal-btn').addEventListener('click', () => {
                document.getElementById('personnel-form').reset();
                document.getElementById('edit-index').value = -1;
                document.getElementById('modal-title').innerText = "Add New Personnel";
                document.getElementById('emp-id').readOnly = false;
                document.getElementById('role-type').disabled = false;
                document.getElementById('personnel-modal').classList.add('active');
            });
        }
        
        if(document.getElementById('open-pdb-modal-btn')) {
            document.getElementById('open-pdb-modal-btn').addEventListener('click', () => {
                document.getElementById('pdb-form').reset();
                document.getElementById('pdb-edit-index').value = -1;
                document.getElementById('pdb-modal-title').innerText = "Add Secure ID Record";
                document.getElementById('pdb-name').readOnly = false;
                document.getElementById('pdb-modal').classList.add('active');
            });
        }

        // Close Modals
        document.querySelectorAll('#close-modal-btn, #cancel-modal-btn').forEach(b => 
            b.addEventListener('click', () => document.getElementById('personnel-modal').classList.remove('active'))
        );
        document.querySelectorAll('#close-pdb-modal-btn, #cancel-pdb-modal-btn').forEach(b => 
            b.addEventListener('click', () => document.getElementById('pdb-modal').classList.remove('active'))
        );

        // --- Initial Load ---
        renderDirectory();
    </script>
</body>
</html>
