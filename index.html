<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAM-ON ES INVENTORY PORTAL</title>
  <!-- Tailwind CSS & FontAwesome Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- PapaParse for CSV Support -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-blue-900 text-white p-4 shadow-lg">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-boxes-stacked text-2xl text-blue-300"></i>
        <div>
          <h1 class="text-xl font-bold tracking-wide">MAM-ON ES INVENTORY PORTAL</h1>
          <p class="text-xs text-blue-200">School ID: 132649 | Inventory Count Form 2026</p>
        </div>
      </div>
      
      <div class="flex items-center gap-2">
        <!-- Import CSV Button -->
        <label for="csvFileInput" class="cursor-pointer bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded text-xs font-semibold shadow transition flex items-center gap-2">
          <i class="fa-solid fa-file-import"></i> Import CSV
        </label>
        <input type="file" id="csvFileInput" accept=".csv" class="hidden" onchange="importCSV(event)" />

        <!-- Add Item Button -->
        <button onclick="toggleModal(true)" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded text-xs font-semibold shadow transition flex items-center gap-2">
          <i class="fa-solid fa-plus"></i> Add Item
        </button>

        <!-- Reset Portal -->
        <button onclick="clearData()" class="bg-rose-600 hover:bg-rose-700 text-white px-3 py-2 rounded text-xs font-semibold shadow transition flex items-center gap-2">
          <i class="fa-solid fa-rotate-left"></i> Reset
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl w-full mx-auto my-6 p-4 flex-1">
    
    <!-- Filter Bar -->
    <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200 mb-6 flex flex-col md:flex-row gap-4 justify-between items-center">
      <!-- Search Input -->
      <div class="relative w-full md:w-1/2">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
        <input type="text" id="searchInput" onkeyup="filterItems()" 
               placeholder="Search item, room, ID or teacher..." 
               class="w-full pl-9 pr-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
      </div>
      
      <!-- Status Filter -->
      <div class="w-full md:w-1/4">
        <select id="statusFilter" onchange="filterItems()" class="w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-white">
          <option value="ALL">(All conditions)</option>
          <option value="Good">Good</option>
          <option value="Needs Repair">Needs Repair</option>
          <option value="Unserviceable">Unserviceable</option>
        </select>
      </div>
    </div>

    <!-- Data Table -->
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-x-auto">
      <table class="w-full text-left border-collapse text-sm">
        <thead class="bg-gray-800 text-white text-xs uppercase tracking-wider">
          <tr>
            <th class="p-3">ITEM DETAILS</th>
            <th class="p-3">CATEGORY & QTY</th>
            <th class="p-3">LOCATION</th>
            <th class="p-3">ASSIGNED TO</th>
            <th class="p-3">STATUS</th>
            <th class="p-3 text-center">ACTION</th>
          </tr>
        </thead>
        <tbody id="inventoryTableBody" class="divide-y divide-gray-200">
          <!-- Rows render here dynamically -->
        </tbody>
      </table>
    </div>

  </main>

  <!-- Add Item Modal -->
  <div id="itemModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-lg shadow-xl max-w-md w-full p-6 space-y-4">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="text-lg font-bold text-gray-800">Add New Inventory Item</h3>
        <button onclick="toggleModal(false)" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      <form id="addForm" onsubmit="handleFormSubmit(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Item Name</label>
          <input type="text" id="itemName" required class="w-full p-2 border rounded text-sm focus:ring-2 focus:ring-blue-500">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Category</label>
            <input type="text" id="itemCat" placeholder="e.g. ICT, Office" required class="w-full p-2 border rounded text-sm focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Quantity</label>
            <input type="number" id="itemQty" value="1" min="1" required class="w-full p-2 border rounded text-sm focus:ring-2 focus:ring-blue-500">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Location / Room</label>
          <input type="text" id="itemLoc" placeholder="e.g. Computer Room" required class="w-full p-2 border rounded text-sm focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Assigned To</label>
          <input type="text" id="itemAssign" placeholder="e.g. School Property Custodian" required class="w-full p-2 border rounded text-sm focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Status</label>
          <select id="itemStatus" class="w-full p-2 border rounded text-sm focus:ring-2 focus:ring-blue-500">
            <option value="Good">Good</option>
            <option value="Needs Repair">Needs Repair</option>
            <option value="Unserviceable">Unserviceable</option>
          </select>
        </div>
        <div class="pt-3 flex justify-end gap-2">
          <button type="button" onclick="toggleModal(false)" class="px-4 py-2 border rounded text-xs text-gray-600 hover:bg-gray-100">Cancel</button>
          <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded text-xs hover:bg-blue-700">Save Item</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Initial sample dataset
    const initialDatabase = [
      { id: 1, name: "Desktop Package (COBY)", category: "ICT Equipment", qty: 1, location: "Computer Room", assigned: "Property Custodian", status: "Good" },
      { id: 2, name: "Interactive Projector (PIXPRO)", category: "ICT Equipment", qty: 1, location: "Computer Room", assigned: "Grade 1 Teacher", status: "Unserviceable" },
      { id: 3, name: "Epson Printer L3210 3-in-1", category: "ICT Equipment", qty: 1, location: "Computer Room", assigned: "Office Clerk", status: "Good" },
      { id: 4, name: "DEVANT 55\" Smart UHD TV", category: "ICT Equipment", qty: 1, location: "Grade 2 Classroom", assigned: "Grade 2 Adviser", status: "Good" },
      { id: 5, name: "Stand Fan", category: "Office Equipment", qty: 2, location: "Kindergarten Room", assigned: "Kinder Adviser", status: "Needs Repair" }
    ];

    // Local Storage helpers
    function getStoredData() {
      const stored = localStorage.getItem('mamon_inventory_portal');
      return stored ? JSON.parse(stored) : initialDatabase;
    }

    function setStoredData(data) {
      localStorage.setItem('mamon_inventory_portal', JSON.stringify(data));
      filterItems();
    }

    // Render Table Rows
    function renderTable(items) {
      const tbody = document.getElementById('inventoryTableBody');
      tbody.innerHTML = '';

      if (!items || items.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="p-8 text-center text-gray-400">
              <i class="fa-regular fa-folder-open text-3xl mb-2"></i>
              <p>No records found.</p>
            </td>
          </tr>`;
        return;
      }

      items.forEach(item => {
        let statusBadge = "bg-emerald-100 text-emerald-800 border-emerald-300";
        if (item.status === "Needs Repair") statusBadge = "bg-amber-100 text-amber-800 border-amber-300";
        if (item.status === "Unserviceable") statusBadge = "bg-rose-100 text-rose-800 border-rose-300";

        const tr = document.createElement('tr');
        tr.className = "hover:bg-gray-50 transition";
        tr.innerHTML = `
          <td class="p-3 font-semibold text-gray-800">${item.name}</td>
          <td class="p-3 text-gray-600">
            <span class="block text-xs text-gray-500">${item.category}</span>
            <span class="font-medium">Qty: ${item.qty}</span>
          </td>
          <td class="p-3 text-gray-600">${item.location}</td>
          <td class="p-3 text-gray-600">${item.assigned}</td>
          <td class="p-3">
            <span class="px-2.5 py-1 text-xs font-semibold border rounded-full ${statusBadge}">
              ${item.status}
            </span>
          </td>
          <td class="p-3 text-center">
            <button onclick="deleteItem(${item.id})" class="text-rose-500 hover:text-rose-700 p-1 rounded" title="Delete">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Filter Logic
    function filterItems() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const statusFilter = document.getElementById('statusFilter').value;
      const data = getStoredData();

      const filtered = data.filter(item => {
        const matchesSearch = 
          item.name.toLowerCase().includes(search) ||
          item.location.toLowerCase().includes(search) ||
          item.assigned.toLowerCase().includes(search) ||
          item.category.toLowerCase().includes(search);

        const matchesStatus = statusFilter === "ALL" || item.status === statusFilter;

        return matchesSearch && matchesStatus;
      });

      renderTable(filtered);
    }

    // Add New Item
    function handleFormSubmit(e) {
      e.preventDefault();
      const data = getStoredData();
      const newItem = {
        id: Date.now(),
        name: document.getElementById('itemName').value,
        category: document.getElementById('itemCat').value,
        qty: parseInt(document.getElementById('itemQty').value, 10),
        location: document.getElementById('itemLoc').value,
        assigned: document.getElementById('itemAssign').value,
        status: document.getElementById('itemStatus').value
      };

      data.unshift(newItem);
      setStoredData(data);
      toggleModal(false);
      document.getElementById('addForm').reset();
    }

    // Delete Item
    function deleteItem(id) {
      if (confirm('Are you sure you want to delete this entry?')) {
        const data = getStoredData().filter(item => item.id !== id);
        setStoredData(data);
      }
    }

    // Modal Control
    function toggleModal(show) {
      const modal = document.getElementById('itemModal');
      modal.style.display = show ? 'flex' : 'none';
    }

    // CSV Import Logic
    function importCSV(event) {
      const file = event.target.files[0];
      if (!file) return;

      Papa.parse(file, {
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          const parsedData = results.data.map((row, idx) => ({
            id: Date.now() + idx,
            name: row['Article/Item'] || row['Item Name'] || row['Article'] || 'Unnamed Item',
            category: row['Category'] || row['Instruction'] || 'General Property',
            qty: parseInt(row['Qty'] || row['Quantity per Physical Count'] || 1, 10),
            location: row['Location'] || row['Location/ Whereabouts'] || 'Mam-on ES',
            assigned: row['Assigned To'] || row['Person Responsible'] || 'School Admin',
            status: row['Status'] || row['Condition'] || 'Good'
          }));

          setStoredData(parsedData);
          alert('CSV inventory data imported successfully!');
        }
      });
    }

    // Reset Data
    function clearData() {
      if (confirm("Reset inventory data back to original defaults?")) {
        localStorage.removeItem('mamon_inventory_portal');
        filterItems();
      }
    }

    // Initialize Page
    document.addEventListener('DOMContentLoaded', () => {
      filterItems();
    });
  </script>
</body>
</html>
