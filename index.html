<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

  :root {
    --theme-color: #4f46e5;
  }

  * {
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }

  html, body {
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
    background-color: #f1f5f9;
    background-attachment: fixed;
    background-size: cover;
    background-position: center;
    overscroll-behavior-y: none; /* Prevents pull-to-refresh on mobile */
  }

  button, a, input, select {
    touch-action: manipulation; /* Removes 300ms click delay on mobile */
  }

  /* Theme Utility Classes */
  .theme-bg {
    background-color: var(--theme-color) !important;
    color: white !important;
  }

  .theme-bg-hover:hover {
    filter: brightness(0.9);
  }

  .theme-text {
    color: var(--theme-color) !important;
  }

  .theme-border {
    border-color: var(--theme-color) !important;
  }

  .theme-ring:focus {
    box-shadow: 0 0 0 2px var(--theme-color) !important;
  }

  /* Layout Helpers */
  .ios-scroll {
    -webkit-overflow-scrolling: touch;
  }

  header {
    padding-top: max(1rem, env(safe-area-inset-top));
  }

  footer, .ios-bottom-pad {
    padding-bottom: max(1rem, env(safe-area-inset-bottom));
  }

  #reader {
    width: 100% !important;
    border-radius: 1rem;
    overflow: hidden;
  }

  #reader video {
    object-fit: cover !important;
    border-radius: 1rem;
  }

  .admin-only {
    display: none;
  }

  body.has-bg::before {
    content: '';
    position: fixed;
    inset: 0;
    background: rgba(241, 245, 249, 0.85);
    backdrop-filter: blur(5px);
    z-index: -1;
  }

  /* Icon Transparency & Hover Transitions */
  .icon-container, i, svg {
    opacity: 0.75; /* 75% opacity by default */
    transition: opacity 0.2s ease-in-out, transform 0.2s ease-in-out;
  }

  .icon-container:hover, i:hover, svg:hover {
    opacity: 1; /* 100% visible on hover */
    transform: translateY(-1px);
  }

  /* Frosted Glass Icon Badge */
  .icon-badge {
    background: rgba(255, 255, 255, 0.2);
    -webkit-backdrop-filter: blur(8px); /* Safari support */
    backdrop-filter: blur(8px);
    border-radius: 8px;
    padding: 8px;
  }
</style>
