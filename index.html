<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAM-ON ES INVENTORY PORTAL</title>
  <!-- Tailwind CSS & FontAwesome Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- PapaParse for Google Sheets CSV Parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-blue-900 text-white p-4 shadow-lg">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-boxes-stacked text-2xl text-blue-300"></i>
        <div>
          <h1 class="text-xl font-bold tracking-wide">MAM-ON ES INVENTORY PORTAL</h1>
          <p class="text-xs text-blue-200">School ID: 132649 | Live Google Sheet Sync</p>
        </div>
      </div>
      
      <div class="flex items-center gap-2">
        <!-- Sync Status Indicator -->
        <div id="syncStatus" class="flex items-center gap-2 bg-blue-950 px-3 py-1.5 rounded text-xs text-blue-200 border border-blue-700">
          <i class="fa-solid fa-rotate text-blue-400" id="syncSpinner"></i>
          <span id="syncText">Syncing...</span>
        </div>

        <!-- Refresh Button -->
        <button onclick="fetchGoogleSheetData()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded text-xs font-semibold shadow transition flex items-center gap-1.5">
          <i class="fa-solid fa-arrows-rotate"></i> Refresh Sheet
        </button>

        <!-- Import Local CSV Option -->
        <label for="csvFileInput" class="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded text-xs font-semibold shadow transition flex items-center gap-1.5">
          <i class="fa-solid fa-file-import"></i> Upload CSV
        </label>
        <input type="file" id="csvFileInput" accept=".csv" class="hidden" onchange="importLocalCSV(event)" />
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl w-full mx-auto my-6 p-4 flex-1">
    
    <!-- Filter Bar -->
    <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200 mb-6 flex flex-col md:flex-row gap-4 justify-between items-center">
      <!-- Search Input -->
      <div class="relative w-full md:w-1/2">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
        <input type="text" id="searchInput" onkeyup="filterItems()" 
               placeholder="Search item, room, property no, or teacher..." 
               class="w-full pl-9 pr-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
      </div>
      
      <!-- Status Filter -->
      <div class="w-full md:w-1/4">
        <select id="statusFilter" onchange="filterItems()" class="w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-white">
          <option value="ALL">(All conditions)</option>
          <option value="Good">Good / Serviceable</option>
          <option value="Needs Repair">Needs Repair</option>
          <option value="Unserviceable">Unserviceable</option>
        </select>
      </div>
    </div>

    <!-- Data Table -->
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-x-auto">
      <table class="w-full text-left border-collapse text-sm">
        <thead class="bg-gray-800 text-white text-xs uppercase tracking-wider">
          <tr>
            <th class="p-3">ITEM DETAILS</th>
            <th class="p-3">CATEGORY & QTY</th>
            <th class="p-3">LOCATION</th>
            <th class="p-3">ASSIGNED TO</th>
            <th class="p-3">STATUS</th>
          </tr>
        </thead>
        <tbody id="inventoryTableBody" class="divide-y divide-gray-200">
          <!-- Dynamic Live Rows Render Here -->
        </tbody>
      </table>
    </div>

  </main>

  <script>
    // ⚠️ REPLACE THIS LINK WITH YOUR PUBLISHED CSV URL
    // (In Google Sheets: File > Share > Publish to web > Select CSV > Copy Link)
    const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR_EXAMPLE_URL_HERE/pub?output=csv";

    // Initial fallback data from INVENTORY COUNT FORM 2026.xlsx
    const fallbackDatabase = [
      { id: 1, name: "Desktop Package (COBY, CAAG038120111)", category: "ICT Equipment", qty: 1, value: "₱35,639.34", location: "Computer Room", assigned: "Property Custodian", status: "Good" },
      { id: 2, name: "Interactive Projector (PIXPRO iSHOW ACTIVA X1600)", category: "ICT Equipment", qty: 1, value: "₱38,426.17", location: "Computer Room", assigned: "Grade 1 Teacher", status: "Unserviceable" },
      { id: 3, name: "Epson Printer L3210 3-in-1", category: "ICT Equipment", qty: 1, value: "₱9,000.00", location: "Computer Room", assigned: "Office Clerk", status: "Good" },
      { id: 4, name: "TCL LED TV 32\" (S/N: 2203ALY176378B00503)", category: "ICT Equipment", qty: 1, value: "₱11,988.00", location: "Computer Room", assigned: "Property Custodian", status: "Good" },
      { id: 5, name: "DEVANT UHD TV 55\" (S/N: 55UHW201L112301699)", category: "ICT Equipment", qty: 1, value: "₱21,100.00", location: "Grade 2 Classroom", assigned: "Grade 2 Adviser", status: "Good" },
      { id: 6, name: "SAMSUNG Smart TV 55\" (S/N: 08F43NMX800262V)", category: "ICT Equipment", qty: 1, value: "₱24,990.00", location: "Grade 3 Classroom", assigned: "Grade 3 Adviser", status: "Good" },
      { id: 7, name: "Stand Fan (Standard 16\")", category: "Office Equipment", qty: 1, value: "₱1,500.00", location: "Kindergarten Room", assigned: "Kinder Adviser", status: "Good" },
      { id: 8, name: "Building 1 (Office, Kinder, G1, Computer Lab)", category: "Buildings & Facilities", qty: 1, value: "N/A", location: "Mam-on ES Main Campus", assigned: "School Head", status: "Good" },
      { id: 9, name: "Pagpahanas sa Pagpangadam (Kinder LRM)", category: "Books & Learning Materials", qty: 52, value: "N/A", location: "Kindergarten Room", assigned: "Kinder Teacher", status: "Good" }
    ];

    let liveDatabase = [...fallbackDatabase];

    // Fetch Google Sheet live data directly via PapaParse
    function fetchGoogleSheetData() {
      const syncText = document.getElementById('syncText');
      const syncSpinner = document.getElementById('syncSpinner');

      syncText.innerText = "Syncing Sheet...";
      syncSpinner.classList.add('animate-spin');

      if (!GOOGLE_SHEET_CSV_URL.includes("docs.google.com")) {
        syncText.innerText = "Fallback Mode (Set Published URL)";
        syncSpinner.classList.remove('animate-spin');
        filterItems();
        return;
      }

      Papa.parse(GOOGLE_SHEET_CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          liveDatabase = results.data.map((row, idx) => ({
            id: idx + 1,
            name: row['Article/Item'] || row['Item Name'] || row['Article'] || row['Description'] || 'Unnamed Item',
            category: row['Category'] || row['Instruction'] || 'General Property',
            qty: parseInt(row['Qty'] || row['Quantity per Physical Count'] || row['Quantity per Property Card'] || 1, 10),
            value: row['Unit Value'] ? `₱${row['Unit Value']}` : '',
            location: row['Location'] || row['Location/ Whereabouts'] || 'Mam-on ES',
            assigned: row['Assigned To'] || row['Person Responsible'] || 'School Admin',
            status: row['Status'] || row['Condition'] || 'Good'
          }));

          syncText.innerText = "Live Sheet Active";
          syncSpinner.classList.remove('animate-spin');
          filterItems();
        },
        error: function(err) {
          syncText.innerText = "Sync Failed (Using Fallback)";
          syncSpinner.classList.remove('animate-spin');
          console.error("Sheet Sync Failed: ", err);
          filterItems();
        }
      });
    }

    // Render Table Rows
    function renderTable(items) {
      const tbody = document.getElementById('inventoryTableBody');
      tbody.innerHTML = '';

      if (!items || items.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5" class="p-8 text-center text-gray-400">
              <i class="fa-regular fa-folder-open text-3xl mb-2"></i>
              <p>No inventory records found.</p>
            </td>
          </tr>`;
        return;
      }

      items.forEach(item => {
        let statusBadge = "bg-emerald-100 text-emerald-800 border-emerald-300";
        if (item.status?.toLowerCase().includes('repair')) statusBadge = "bg-amber-100 text-amber-800 border-amber-300";
        if (item.status?.toLowerCase().includes('unserviceable')) statusBadge = "bg-rose-100 text-rose-800 border-rose-300";

        const tr = document.createElement('tr');
        tr.className = "hover:bg-gray-50 transition";
        tr.innerHTML = `
          <td class="p-3 font-semibold text-gray-800">
            ${item.name}
            ${item.value ? `<span class="block text-xs font-normal text-gray-500">Val: ${item.value}</span>` : ''}
          </td>
          <td class="p-3 text-gray-600">
            <span class="block text-xs text-gray-500">${item.category}</span>
            <span class="font-medium">Qty: ${item.qty}</span>
          </td>
          <td class="p-3 text-gray-600">${item.location}</td>
          <td class="p-3 text-gray-600">${item.assigned}</td>
          <td class="p-3">
            <span class="px-2.5 py-1 text-xs font-semibold border rounded-full ${statusBadge}">
              ${item.status}
            </span>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Filter Logic
    function filterItems() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const statusFilter = document.getElementById('statusFilter').value;

      const filtered = liveDatabase.filter(item => {
        const matchesSearch = 
          item.name.toLowerCase().includes(search) ||
          item.location.toLowerCase().includes(search) ||
          item.assigned.toLowerCase().includes(search) ||
          item.category.toLowerCase().includes(search);

        const matchesStatus = statusFilter === "ALL" || item.status.toLowerCase().includes(statusFilter.toLowerCase());

        return matchesSearch && matchesStatus;
      });

      renderTable(filtered);
    }

    // Import Local CSV Manual Fallback
    function importLocalCSV(event) {
      const file = event.target.files[0];
      if (!file) return;

      Papa.parse(file, {
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          liveDatabase = results.data.map((row, idx) => ({
            id: idx + 1,
            name: row['Article/Item'] || row['Item Name'] || row['Article'] || 'Unnamed Item',
            category: row['Category'] || row['Instruction'] || 'General Property',
            qty: parseInt(row['Qty'] || row['Quantity per Physical Count'] || 1, 10),
            value: row['Unit Value'] ? `₱${row['Unit Value']}` : '',
            location: row['Location'] || row['Location/ Whereabouts'] || 'Mam-on ES',
            assigned: row['Assigned To'] || row['Person Responsible'] || 'School Admin',
            status: row['Status'] || row['Condition'] || 'Good'
          }));

          document.getElementById('syncText').innerText = "Loaded Local CSV";
          filterItems();
        }
      });
    }

    // Initialize Page & Auto Sync every 60 seconds
    document.addEventListener('DOMContentLoaded', () => {
      fetchGoogleSheetData();
      setInterval(fetchGoogleSheetData, 60000);
    });
  </script>
</body>
</html>
