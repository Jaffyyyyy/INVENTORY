<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Editor Profile</title>
  <style>
    /* CSS Reset & General Rules */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    /* Container Card */
    .editor-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 1.5rem;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      gap: 1.25rem;
      transition: all 0.3s ease;
    }

    .editor-card:hover {
      border-color: #3b82f6;
      box-shadow: 0 12px 30px -5px rgba(59, 130, 246, 0.2);
    }

    /* Profile Avatar & Status Badge */
    .avatar-wrapper {
      position: relative;
      flex-shrink: 0;
    }

    .avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      font-weight: 700;
      font-size: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #38bdf8;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .status-dot {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 14px;
      height: 14px;
      background-color: #10b981;
      border: 2px solid #1e293b;
      border-radius: 50%;
    }

    /* Text Information */
    .editor-info {
      flex: 1;
      min-width: 0;
    }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.65rem;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #38bdf8;
      background-color: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 9999px;
      margin-bottom: 0.35rem;
    }

    .editor-name {
      font-size: 1.2rem;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .editor-role {
      font-size: 0.875rem;
      color: #94a3b8;
      margin-top: 0.15rem;
    }

    /* Action Button */
    .actions {
      display: flex;
      align-items: center;
    }

    .edit-btn {
      background: #3b82f6;
      color: #ffffff;
      border: none;
      padding: 0.6rem 1.1rem;
      font-size: 0.875rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .edit-btn:hover {
      background: #2563eb;
    }

    .edit-btn:active {
      transform: scale(0.98);
    }

    /* Responsive adjustments for mobile devices */
    @media (max-width: 480px) {
      .editor-card {
        flex-direction: column;
        text-align: center;
        padding: 1.5rem;
      }

      .editor-info {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .actions {
        width: 100%;
        margin-top: 0.5rem;
      }

      .edit-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- Admin Editor Component -->
  <div class="editor-card">
    <div class="avatar-wrapper">
      <div class="avatar">JC</div>
      <span class="status-dot" title="Active Editor"></span>
    </div>
    
    <div class="editor-info">
      <span class="badge">Admin Editor</span>
      <h2 class="editor-name" title="Jasper S. Campado">Jasper S. Campado</h2>
      <p class="editor-role">System Administrator & Lead Editor</p>
    </div>

    <div class="actions">
      <button class="edit-btn">Manage</button>
    </div>
  </div>

</body>
</html>
