<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAM-ON ES - Personnel & Inventory Portal</title>
    <!-- Google Fonts & FontAwesome -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #eff6ff;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 12px;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: var(--text); line-height: 1.5; }

        /* Navbar */
        .navbar { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; padding: 0.85rem 1.5rem; }
        .nav-container { max-width: 1400px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .brand { display: flex; align-items: center; gap: 0.75rem; }
        .brand-icon { width: 40px; height: 40px; background: var(--primary-light); color: var(--primary); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; }
        .brand-title { font-size: 1.1rem; font-weight: 800; display: flex; align-items: center; gap: 0.5rem; }
        .badge-mode { font-size: 0.65rem; padding: 2px 8px; border-radius: 9999px; font-weight: 700; text-transform: uppercase; background: #e2e8f0; color: #475569; }

        /* Layout */
        .container { max-width: 1400px; margin: 0 auto; padding: 2rem 1.5rem; }

        /* Metrics */
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.25rem; margin-bottom: 1.5rem; }
        .metric-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; box-shadow: var(--shadow-sm); }
        .metric-header { display: flex; align-items: center; justify-content: space-between; color: var(--text-muted); font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem; }
        .metric-value { font-size: 1.75rem; font-weight: 800; }

        /* Controls & Filter Bar */
        .controls-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; margin-bottom: 1.5rem; display: flex; gap: 1rem; flex-wrap: wrap; justify-content: space-between; }
        .search-box { position: relative; flex: 1; min-width: 250px; }
        .search-box i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #94a3b8; }
        .form-input { width: 100%; padding: 0.55rem 0.75rem 0.55rem 2.25rem; border-radius: 8px; border: 1px solid var(--border); outline: none; font-size: 0.875rem; }

        /* Table */
        .table-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-sm); }
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.875rem; text-align: left; }
        th { background: #f8fafc; padding: 0.85rem 1rem; color: var(--text-muted); font-weight: 700; font-size: 0.75rem; text-transform: uppercase; border-bottom: 1px solid var(--border); }
        td { padding: 1rem; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
        tr:hover { background-color: #f8fafc; }

        /* Badges */
        .badge-role { padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; }
        .badge-principal { background: #fef3c7; color: #92400e; }
        .badge-ao { background: #e0e7ff; color: #3730a3; }
        .badge-teacher { background: #dcfce7; color: #166534; }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="navbar">
        <div class="nav-container">
            <div class="brand">
                <div class="brand-icon"><i class="fa-solid fa-school"></i></div>
                <div>
                    <div class="brand-title">
                        MAM-ON ELEMENTARY SCHOOL
                        <span class="badge-mode">Data Viewer Mode</span>
                    </div>
                    <div style="font-size: 0.75rem; color: var(--text-muted);">Personnel Profiling & Database</div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="container">
        <!-- Summary Cards -->
        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-header"><span>Total Personnel</span><i class="fa-solid fa-users"></i></div>
                <div class="metric-value" id="total-count">0</div>
            </div>
            <div class="metric-card">
                <div class="metric-header"><span>School Head</span><i class="fa-solid fa-user-tie"></i></div>
                <div class="metric-value" id="principal-count">0</div>
            </div>
            <div class="metric-card">
                <div class="metric-header"><span>Teaching Staff</span><i class="fa-solid fa-chalkboard-user"></i></div>
                <div class="metric-value" id="teacher-count">0</div>
            </div>
            <div class="metric-card">
                <div class="metric-header"><span>Non-Teaching</span><i class="fa-solid fa-user-gear"></i></div>
                <div class="metric-value" id="non-teaching-count">0</div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls-card">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-input" class="form-input" placeholder="Search by name, position, degree, or email...">
            </div>
        </div>

        <!-- Personnel Table -->
        <div class="table-card">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Emp ID</th>
                            <th>Full Name</th>
                            <th>Position / Title</th>
                            <th>Department</th>
                            <th>Degree & Major</th>
                            <th>Date Hired</th>
                            <th>Contact / Email</th>
                        </tr>
                    </thead>
                    <tbody id="personnel-table-body">
                        <!-- Rendered dynamically -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

        const tableBody = document.getElementById('personnel-table-body');
        const searchInput = document.getElementById('search-input');

        function renderTable(filterText = '') {
            const query = filterText.toLowerCase();
            const filtered = personnelData.filter(item => 
                item.name.toLowerCase().includes(query) ||
                item.position.toLowerCase().includes(query) ||
                item.degree.toLowerCase().includes(query) ||
                item.email.toLowerCase().includes(query)
            );

            tableBody.innerHTML = filtered.map(item => {
                let badgeClass = 'badge-teacher';
                if (item.roleType === 'principal') badgeClass = 'badge-principal';
                if (item.roleType === 'ao') badgeClass = 'badge-ao';

                return `
                    <tr>
                        <td><strong>${item.id}</strong></td>
                        <td><strong>${item.name}</strong></td>
                        <td><span class="badge-role ${badgeClass}">${item.position}</span></td>
                        <td>${item.department}</td>
                        <td>${item.degree}</td>
                        <td>${item.dateHired}</td>
                        <td>
                            <div><i class="fa-regular fa-envelope"></i> ${item.email}</div>
                            <small style="color: var(--text-muted);"><i class="fa-solid fa-phone"></i> ${item.contact}</small>
                        </td>
                    </tr>
                `;
            }).join('');

            // Update Metrics
            document.getElementById('total-count').innerText = personnelData.length;
            document.getElementById('principal-count').innerText = personnelData.filter(p => p.roleType === 'principal').length;
            document.getElementById('teacher-count').innerText = personnelData.filter(p => p.roleType === 'teacher').length;
            document.getElementById('non-teaching-count').innerText = personnelData.filter(p => p.roleType === 'ao').length;
        }

        searchInput.addEventListener('input', (e) => renderTable(e.target.value));

        // Initial Load
        renderTable();
    </script>
</body>
</html>
