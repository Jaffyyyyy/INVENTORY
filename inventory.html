<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management App</title>
    <style>
        * { box-sizing: border-box; transition: all 0.2s ease-in-out; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f6f8fa; color: #24292f; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { margin: 0; font-size: 1.8rem; font-weight: 600; }
        
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 8px 24px rgba(149, 157, 165, 0.1); margin-bottom: 20px; }
        
        .form-grid { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 10px; margin-bottom: 10px; }
        input { width: 100%; padding: 12px; border: 1px solid #d0d7de; border-radius: 8px; font-size: 14px; outline: none; }
        input:focus { border-color: #0969da; box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.15); }
        
        button { background-color: #2da44e; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; }
        button:hover { background-color: #2c974b; transform: translateY(-1px); }
        .btn-delete { background-color: #cf222e; padding: 6px 12px; font-size: 12px; }
        .btn-delete:hover { background-color: #a40e26; }

        .search-bar { margin-bottom: 15px; }

        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 14px 16px; border-bottom: 1px solid #hsla(210,18%,87%,1); }
        th { background-color: #f6f8fa; font-weight: 600; color: #57606a; border-radius: 6px; }
        tr:hover { background-color: #f8f9fa; }

        .badge { background: #ddf4ff; color: #0969da; padding: 4px 8px; border-radius: 20px; font-weight: 600; font-size: 12px; }
        .empty-state { text-align: center; color: #57606a; padding: 40px 0; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>📦 Inventory Dashboard</h1>
        <span class="badge" id="itemCount">0 Items</span>
    </header>

    <!-- Add Item Form -->
    <div class="card">
        <h3>Add New Product</h3>
        <div class="form-grid">
            <input type="text" id="name" placeholder="Item Name">
            <input type="number" id="qty" placeholder="Quantity">
            <input type="number" step="0.01" id="price" placeholder="Price ($)">
            <button onclick="addItem()">Add Item</button>
        </div>
    </div>

    <!-- Inventory Display Table -->
    <div class="card">
        <div class="search-bar">
            <input type="text" id="searchInput" onkeyup="renderTable()" placeholder="🔍 Search inventory dynamically...">
        </div>

        <table>
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Quantity</th>
                    <th>Price</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="inventoryBody"></tbody>
        </table>
        <div id="emptyMsg" class="empty-state" style="display: none;">No inventory items found. Add one above!</div>
    </div>
</div>

<script>
    // Load inventory from browser local storage
    let inventory = JSON.parse(localStorage.getItem('my_inventory')) || [];

    function saveAndRender() {
        localStorage.setItem('my_inventory', JSON.stringify(inventory));
        renderTable();
    }

    function addItem() {
        const name = document.getElementById('name').value.trim();
        const qty = document.getElementById('qty').value.trim();
        const price = document.getElementById('price').value.trim();

        if (!name || !qty || !price) {
            alert('Please enter all product details!');
            return;
        }

        inventory.push({ id: Date.now(), name, qty, price });
        
        document.getElementById('name').value = '';
        document.getElementById('qty').value = '';
        document.getElementById('price').value = '';

        saveAndRender();
    }

    function deleteItem(id) {
        inventory = inventory.filter(item => item.id !== id);
        saveAndRender();
    }

    function renderTable() {
        const tbody = document.getElementById('inventoryBody');
        const search = document.getElementById('searchInput').value.toLowerCase();
        const emptyMsg = document.getElementById('emptyMsg');
        
        tbody.innerHTML = '';

        const filtered = inventory.filter(item => item.name.toLowerCase().includes(search));

        document.getElementById('itemCount').innerText = `${filtered.length} Items`;

        if (filtered.length === 0) {
            emptyMsg.style.display = 'block';
            return;
        } else {
            emptyMsg.style.display = 'none';
        }

        filtered.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${item.name}</strong></td>
                <td>${item.qty}</td>
                <td>$${parseFloat(item.price).toFixed(2)}</td>
                <td><button class="btn-delete" onclick="deleteItem(${item.id})">Delete</button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    // Initial render on page open
    renderTable();
</script>

</body>
</html>
