<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>School Portal Dashboard</title>
  <!-- Tailwind CSS for styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- jsPDF for Report Cards -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800">

  <!-- Header -->
  <header class="bg-blue-900 text-white px-6 py-4 flex justify-between items-center shadow-lg">
    <div class="flex items-center space-x-3">
      <div class="bg-yellow-400 p-2 rounded-full text-blue-900 font-extrabold text-xl">🏫</div>
      <div>
        <h1 class="font-bold text-lg leading-tight">MAM-ON ES PORTAL</h1>
        <p class="text-xs text-blue-200">Integrated Academic System</p>
      </div>
    </div>
  </header>

  <main class="p-6 max-w-5xl mx-auto space-y-6">
    <!-- Quick Stats -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-white p-5 rounded-xl border shadow-sm">
        <p class="text-xs text-slate-400 uppercase font-bold">Total Students</p>
        <p class="text-3xl font-black text-slate-800" id="studentCount">0</p>
      </div>
      <div class="bg-white p-5 rounded-xl border shadow-sm">
        <p class="text-xs text-slate-400 uppercase font-bold">Reports Generated</p>
        <p class="text-3xl font-black text-blue-600">0</p>
      </div>
    </div>

    <!-- Student Data Table -->
    <div class="bg-white rounded-xl border overflow-hidden shadow-sm">
      <div class="p-4 bg-slate-100 border-b flex justify-between items-center">
        <h2 class="font-bold">Student Database</h2>
        <button onclick="addDummyStudent()" class="bg-blue-600 text-white px-3 py-1 rounded text-sm font-bold">+ Add Test Student</button>
      </div>
      <table class="w-full text-left">
        <thead>
          <tr class="text-xs uppercase text-slate-500 border-b bg-slate-50">
            <th class="p-3">Name</th>
            <th class="p-3">Grade</th>
            <th class="p-3">Status</th>
            <th class="p-3">Action</th>
          </tr>
        </thead>
        <tbody id="studentList">
          <!-- Students will load here -->
        </tbody>
      </table>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
