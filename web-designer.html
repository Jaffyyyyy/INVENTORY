<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Designer | MAM-ON ES Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col font-sans">

    <!-- Top Navigation -->
    <header class="h-14 bg-slate-800 border-b border-slate-700 px-6 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-4">
            <!-- Back button to return to the main dashboard -->
            <a href="index.html" class="text-slate-400 hover:text-white transition-colors">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
            </a>
            <div class="flex items-center gap-2 border-l border-slate-700 pl-4">
                <i data-lucide="sparkles" class="w-5 h-5 text-blue-400"></i>
                <h1 class="font-bold text-sm tracking-wide">In-Page AI Code Designer</h1>
            </div>
        </div>
        <div class="text-xs text-slate-400">Status: <span id="status" class="text-emerald-400 font-semibold">Ready</span></div>
    </header>

    <!-- Access Denied Message (Shown to non-admins) -->
    <div id="access-denied-message" class="hidden flex-1 flex-col items-center justify-center bg-slate-950 p-6 text-center">
        <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl max-w-md w-full shadow-2xl">
            <i data-lucide="shield-alert" class="w-16 h-16 text-rose-500 mx-auto mb-4"></i>
            <h2 class="text-xl font-bold text-slate-200 mb-2">Administrator Access Required</h2>
            <p class="text-sm text-slate-400 mb-6">Your current role does not have permission to view or use the AI Web Page Adjustment tool.</p>
            <a href="index.html" class="inline-flex items-center justify-center gap-2 w-full py-3 bg-slate-800 hover:bg-slate-700 text-white font-semibold rounded-lg text-sm transition-all border border-slate-700">
                <i data-lucide="home" class="w-4 h-4"></i> Return to Dashboard
            </a>
        </div>
    </div>

    <!-- Main Workspace (Shown to admins) -->
    <div id="ai-designer-workspace" class="flex-1 flex overflow-hidden">
        
        <!-- Left Panel: Prompt & Controls -->
        <div class="w-96 bg-slate-800/50 border-r border-slate-700 p-5 flex flex-col gap-4 overflow-y-auto">
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">API Endpoint / Token</label>
                <input id="apiKey" type="password" placeholder="Enter OpenAI API Key" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white outline-none focus:border-blue-500 transition-colors">
            </div>

            <div class="flex-1 flex flex-col">
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Design Instruction</label>
                <textarea id="aiPrompt" placeholder="e.g., 'Change the card background to blue, add a pricing table, or add a sleek submit button...'" class="w-full flex-1 bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white outline-none focus:border-blue-500 resize-none transition-colors"></textarea>
            </div>

            <button onclick="applyAiChanges()" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg text-sm flex items-center justify-center gap-2 transition-all shadow-lg shadow-blue-600/20 active:scale-95">
                <i data-lucide="wand-2" class="w-4 h-4"></i>
                Generate & Replace Code
            </button>
        </div>

        <!-- Right Panel: Live Viewport -->
        <div class="flex-1 bg-slate-950 p-6 flex flex-col">
            <div class="flex items-center justify-between mb-3">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Live Preview</span>
                <button onclick="resetTemplate()" class="text-xs text-slate-500 hover:text-slate-300 transition-colors flex items-center gap-1">
                    <i data-lucide="rotate-ccw" class="w-3 h-3"></i> Reset Initial Design
                </button>
            </div>
            
            <!-- Dynamic Canvas Frame -->
            <iframe id="previewFrame" class="w-full flex-1 bg-white rounded-xl shadow-2xl border border-slate-800 overflow-hidden"></iframe>
        </div>
    </div>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // --- ROLE CHECKING LOGIC ---
        document.addEventListener("DOMContentLoaded", () => {
            // Retrieve the active role from localStorage. 
            // Change "activeRole" to match whatever key your portal uses when switching roles.
            const savedRole = localStorage.getItem("activeRole") || "Visitor"; 
            
            const designerWorkspace = document.getElementById("ai-designer-workspace");
            const accessDeniedMessage = document.getElementById("access-denied-message");

            // Check if the saved role includes the word "Admin"
            if (!savedRole.includes("Admin")) {
                // Hide workspace
                designerWorkspace.classList.remove("flex");
                designerWorkspace.classList.add("hidden");
                
                // Show access denied
                accessDeniedMessage.classList.remove("hidden");
                accessDeniedMessage.classList.add("flex");
            }
        });

        // --- AI DESIGNER LOGIC ---
        // Initial HTML state inside the live canvas
        let currentCanvasHtml = `
<div class="p-8 max-w-md mx-auto my-10 bg-white rounded-xl shadow-md border border-slate-200 text-slate-800">
    <h2 class="text-xl font-bold mb-2">Sample Component</h2>
    <p class="text-sm text-slate-600 mb-4">Select this block or ask the AI assistant to redesign it live.</p>
    <button class="px-4 py-2 bg-slate-900 text-white rounded-lg text-sm font-semibold hover:bg-slate-800 transition-colors">Click Me</button>
</div>`;

        // Render current state to iframe
        function updatePreview(htmlContent) {
            const iframe = document.getElementById('previewFrame');
            const doc = iframe.contentDocument || iframe.contentWindow.document;
            doc.open();
            doc.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <script src="https://cdn.tailwindcss.com"><\/script>
                </head>
                <body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">
                    <div id="root" class="w-full flex justify-center">${htmlContent}</div>
                </body>
                </html>
            `);
            doc.close();
            currentCanvasHtml = htmlContent;
        }

        // Initialize preview on page load
        updatePreview(currentCanvasHtml);

        function resetTemplate() {
            updatePreview(`
<div class="p-8 max-w-md mx-auto my-10 bg-white rounded-xl shadow-md border border-slate-200 text-slate-800">
    <h2 class="text-xl font-bold mb-2">Sample Component</h2>
    <p class="text-sm text-slate-600 mb-4">Select this block or ask the AI assistant to redesign it live.</p>
    <button class="px-4 py-2 bg-slate-900 text-white rounded-lg text-sm font-semibold hover:bg-slate-800 transition-colors">Click Me</button>
</div>`);
            document.getElementById('status').innerText = "Ready";
            document.getElementById('status').className = "text-emerald-400 font-semibold";
        }

        // AI Processing function
        async function applyAiChanges() {
            const promptText = document.getElementById('aiPrompt').value;
            const apiKey = document.getElementById('apiKey').value;
            const status = document.getElementById('status');

            if (!promptText) {
                alert('Please enter an instruction for the AI.');
                return;
            }
            if (!apiKey) {
                alert('Please enter your API key.');
                return;
            }

            status.innerText = "Generating changes...";
            status.className = "text-amber-400 font-semibold animate-pulse";

            const systemPrompt = `You are an expert web designer. You will receive the current HTML snippet (styled with Tailwind CSS) and a user's design request. 
Return ONLY valid, raw HTML code. Do NOT include markdown formatting (like \`\`\`html), explanations, or conversational text. Use Tailwind CSS classes for styling.`;

            const userContent = `CURRENT HTML:
${currentCanvasHtml}

USER REQUEST:
${promptText}`;

            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: "gpt-4o-mini",
                        messages: [
                            { role: "system", content: systemPrompt },
                            { role: "user", content: userContent }
                        ],
                        temperature: 0.3
                    })
                });

                if (!response.ok) {
                    throw new Error(`API Error: ${response.status}`);
                }

                const data = await response.json();
                
                if (data.choices && data.choices[0]) {
                    // Strip markdown blocks if the AI accidentally includes them
                    let cleanedHtml = data.choices[0].message.content
                        .replace(/^```html/gi, '')
                        .replace(/^```/gi, '')
                        .replace(/```$/gi, '')
                        .trim();
                        
                    updatePreview(cleanedHtml);
                    status.innerText = "Update Complete";
                    status.className = "text-emerald-400 font-semibold";
                }
            } catch (error) {
                console.error("Error generating HTML:", error);
                status.innerText = "Error - Check Console";
                status.className = "text-rose-500 font-semibold";
                alert("Failed to generate changes. Ensure your API key is correct and you have an active internet connection.");
            }
        }
    </script>
</body>
</html>
